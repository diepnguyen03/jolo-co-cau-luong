.node-final{ background:linear-gradient(135deg,#1e1b4b,#312e81); border-color:#6366f1; color:#e0e7ff; }
.node-support{ background:linear-gradient(135deg,#4a1942,#7e1d6c); border-color:#ec4899; color:#fbcfe8; }

.st{ position:absolute; top:-7px; right:-7px; font-size:9px; font-weight:700; border-radius:8px; padding:1px 5px; line-height:1.3; border:1px solid; }

.st-gd{ background:#451a03; color:#fcd34d; border-color:#f59e0b; }

.highlight-box{ border:2px dashed #f59e0b; border-radius:12px; padding:14px; background:rgba(245,158,11,.05); margin-top:12px; }

.org-wrap{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }

.org-col h3{ font-size:12px; color:#38bdf8; margin-bottom:4px; }

.khoi{ border-left:3px solid #38bdf8; padding:6px 0 6px 12px; margin-bottom:10px; }
.khoi-name{ font-size:11px; font-weight:700; color:var(--text); margin-bottom:6px; }

.chip.gd{ border-color:#f59e0b; }
.chip.empty{ border-style:dashed; background:transparent; color:var(--muted); }

.branch-table{ width:100%; border-collapse:collapse; font-size:11px; margin-top:4px; }
.branch-table th{ text-align:left; color:var(--muted); font-weight:600; padding:6px 8px; border-bottom:1px solid var(--line); font-size:10.5px; }
.branch-table td{ padding:6px 8px; border-bottom:1px solid var(--line-2); vertical-align:top; color:var(--text); }
.tag{ display:inline-block; font-size:9.5px; font-weight:700; border-radius:6px; padding:0 5px; border:1px solid; }
.tag.ok{ color:#16a34a; border-color:#22c55e; }
.tag.gd{ color:#d97706; border-color:#f59e0b; }
.tag.empty{ color:var(--muted); border-color:#9ca3af; border-style:dashed; }

.stats{ margin-top:24px; display:grid; grid-template-columns:repeat(5,1fr); gap:12px; }

.stat .v{ font-size:24px; font-weight:700; }
.stat .l{ font-size:11px; color:var(--muted); margin-top:4px; line-height:1.4; }

.issues{ margin-top:20px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px 20px; }
.issues h2{ font-size:12px; letter-spacing:2px; text-transform:uppercase; color:#f87171; margin-bottom:12px; }

.tooltip{ position:fixed; background:#1e293b; border:1px solid #475569; border-radius:8px; padding:10px 14px; font-size:11px; color:#e2e8f0;

.tooltip .warn{ color:#fcd34d; }
.footer{ text-align:center; font-size:11px; color:var(--dim); padding:18px 32px 28px; }

&lt;script&gt;
const tooltip = document.getElementById(&#x27;tooltip&#x27;);
function place(e){
  let x = e.clientX + 14, y = e.clientY + 14;
  const w = tooltip.offsetWidth || 320, h = tooltip.offsetHeight || 160;
  if (x + w + 10 &gt; window.innerWidth) x = Math.max(8, e.clientX - w - 14);
  if (y + h + 10 &gt; window.innerHeight) y = Math.max(8, e.clientY - h - 14);
  tooltip.style.left = x + &#x27;px&#x27;; tooltip.style.top = y + &#x27;px&#x27;;
}
document.querySelectorAll(&#x27;[data-tip]&#x27;).forEach(el =&gt; {
  el.addEventListener(&#x27;mouseenter&#x27;, e =&gt; { tooltip.innerHTML = el.getAttribute(&#x27;data-tip&#x27;); tooltip.style.display = &#x27;block&#x27;; place(e); });
  el.addEventListener(&#x27;mousemove&#x27;, place);
  el.addEventListener(&#x27;mouseleave&#x27;, () =&gt; { tooltip.style.display = &#x27;none&#x27;; });
  el.addEventListener(&#x27;click&#x27;, e =&gt; {
    document.querySelectorAll(&#x27;.node.active&#x27;).forEach(n =&gt; n.classList.remove(&#x27;active&#x27;));
    if (el.classList.contains(&#x27;node&#x27;)) el.classList.add(&#x27;active&#x27;);
    tooltip.innerHTML = el.getAttribute(&#x27;data-tip&#x27;); tooltip.style.display = &#x27;block&#x27;; place(e);
  });
});
document.addEventListener(&#x27;scroll&#x27;, () =&gt; { tooltip.style.display = &#x27;none&#x27;; }, true);
&lt;/script&gt;

.src{ font-size:.7rem; color:var(--text-3); margin-top:.6rem; padding-top:.4rem; border-top:1px dashed var(--tip-line); }

/* Bảng giả định */
.assume{ width:100%; border-collapse:collapse; font-size:.82rem; }
.assume th{ background:var(--green); color:#fff; padding:.5rem .8rem; text-align:left; font-size:.76rem; }
.assume td{ padding:.5rem .8rem; border-bottom:1px solid var(--border); vertical-align:top; }
.table-scroll{ overflow-x:auto; }

footer{ text-align:center; padding:1.75rem; color:var(--text-3); border-top:1px solid var(--border); font-size:.82rem; margin-top:2rem; background:var(--white); }

@media (max-width:900px){
  .glossary-wrap{ grid-template-columns:1fr; }
  .pos-grid{ grid-template-columns:1fr 1fr; }
}
@media (max-width:600px){
  .pos-grid{ grid-template-columns:1fr; }
  .tp-soft-grid{ grid-template-columns:1fr; }
  header h1{ font-size:1.35rem; }
}

  &lt;div class=&quot;meta&quot;&gt;Tổng hợp từ: Cơ cấu lương (Tổng hợp, PT Teacher, TA.Tutor) · 04. Bảng lương (tax) · TNCN NET · 02. BCC · 03. OT list · Bảng công PT &amp;amp; TA.Tutor · File Word phân tích&lt;/div&gt;

    &lt;span&gt;&lt;span class=&quot;b b-empty&quot;&gt;?&lt;/span&gt; Trống — chưa có dữ liệu&lt;/span&gt;
  &lt;/div&gt;
&lt;/header&gt;

&lt;div class=&quot;container&quot;&gt;

&lt;!-- ══ THUẬT NGỮ ══ --&gt;
&lt;div class=&quot;section&quot;&gt;
  &lt;div class=&quot;section-title&quot;&gt;📖 Bảng Thuật Ngữ&lt;/div&gt;
  &lt;div class=&quot;glossary-wrap&quot;&gt;
    &lt;table class=&quot;glossary-table&quot;&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Ký hiệu&lt;/th&gt;&lt;th&gt;Ý nghĩa&lt;/th&gt;&lt;th&gt;Ghi chú / nguồn&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;LCB&lt;/td&gt;&lt;td&gt;Lương cơ bản&lt;/td&gt;&lt;td&gt;Cột J, 04. Bảng lương (tax)&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;T&lt;/td&gt;&lt;td&gt;Công tiêu chuẩn tháng&lt;/td&gt;&lt;td&gt;Từ 02. BCC (vd. 23,5 · 24,5 · 26 · 27; PT = 104 giờ)&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;U&lt;/td&gt;&lt;td&gt;Ngày công tính lương&lt;/td&gt;&lt;td&gt;F + P + PH (02. BCC)&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;PC&lt;/td&gt;&lt;td&gt;Tổng phụ cấp&lt;/td&gt;&lt;td&gt;Ăn ca, trang phục, thuê nhà, điện thoại, đi lại/đào tạo/trách nhiệm&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;K&lt;/td&gt;&lt;td&gt;Thưởng KPI theo công&lt;/td&gt;&lt;td&gt;Mức cố định, chia theo công (GV FT, AM)&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;%KPI&lt;/td&gt;&lt;td&gt;% hoàn thành KPI&lt;/td&gt;&lt;td&gt;Nhập tay từ link đánh giá KPI &amp;amp; OKRs&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;DS&lt;/td&gt;&lt;td&gt;Doanh số thực tế tháng&lt;/td&gt;&lt;td&gt;Kế toán gửi hàng tháng&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;HH&lt;/td&gt;&lt;td&gt;Hoa hồng&lt;/td&gt;&lt;td&gt;3% DS Net (AO, TP)&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;EBM&lt;/td&gt;&lt;td&gt;Hệ thống quản lý lớp&lt;/td&gt;&lt;td&gt;ebm.jolo.edu.vn — nguồn giờ dạy, sĩ số&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;
    &lt;/table&gt;
    &lt;table class=&quot;glossary-table&quot;&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Ký hiệu&lt;/th&gt;&lt;th&gt;Ý nghĩa&lt;/th&gt;&lt;th&gt;Ghi chú / nguồn&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;PT*&lt;/td&gt;&lt;td&gt;Placement Interview / Test đầu vào&lt;/td&gt;&lt;td&gt;Thưởng theo số buổi; GVNN FT có thể quy đổi 0,25h/PT&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;HVĐC&lt;/td&gt;&lt;td&gt;Học viên điểm cao&lt;/td&gt;&lt;td&gt;IELTS ≥ 7.5&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;BC/IDP&lt;/td&gt;&lt;td&gt;Đăng ký thi IELTS qua BC / IDP&lt;/td&gt;&lt;td&gt;3% doanh thu đăng ký thi&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;RT · SA&lt;/td&gt;&lt;td&gt;Round Trip · Severance Allowance&lt;/td&gt;&lt;td&gt;GVNN FT, trả cuối chu kỳ 12 tháng&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;GTGC&lt;/td&gt;&lt;td&gt;Giảm trừ gia cảnh&lt;/td&gt;&lt;td&gt;15.500.000 + 6.200.000 × số NPT&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;BHbb&lt;/td&gt;&lt;td&gt;Bảo hiểm bắt buộc (NV đóng)&lt;/td&gt;&lt;td&gt;8% + 1,5% + 1% = 10,5%&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Loại HĐ&lt;/td&gt;&lt;td&gt;BHXH · XĐTH · &amp;lt;3T · CTV · KXĐ&lt;/td&gt;&lt;td&gt;Quyết định cách tính thuế &amp;amp; BH&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;TV&lt;/td&gt;&lt;td&gt;Loại HĐ trong bảng TA.Tutor&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;b b-gd&quot;&gt;GĐ&lt;/span&gt; Có thể là &quot;thử việc&quot; — được tính thuế như CTV&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;F · P · PH · UP&lt;/td&gt;&lt;td&gt;Ký hiệu chấm công&lt;/td&gt;&lt;td&gt;Làm cả ngày · Phép có lương · Lễ · Nghỉ không lương (có 1/2)&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;
    &lt;/table&gt;
  &lt;/div&gt;
  &lt;p class=&quot;hint&quot; style=&quot;margin:.8rem 0 0&quot;&gt;*Trong tài liệu này &quot;PT&quot; ở cột thưởng = Placement Test/Interview; &quot;PT&quot; ở hình thức = Part-time; &quot;PT Teacher&quot; = GV nước ngoài part-time.&lt;/p&gt;
&lt;/div&gt;

&lt;!-- ══ LUỒNG TÍNH LƯƠNG ══ --&gt;
&lt;div class=&quot;section&quot;&gt;
  &lt;div class=&quot;section-title&quot;&gt;🔄 Luồng Tính Lương (8 Bước)&lt;/div&gt;
  &lt;div class=&quot;flow-wrap&quot;&gt;
    &lt;div class=&quot;flow-card&quot;&gt;
      &lt;div class=&quot;flow-num&quot;&gt;1&lt;/div&gt;
      &lt;h4&gt;Thu thập dữ liệu đầu vào&lt;/h4&gt;
      &lt;ul&gt;
        &lt;li&gt;Lớp, GV, sĩ số, giờ dạy từ EBM; đối chiếu Bản cứng&lt;/li&gt;
        &lt;li&gt;Đăng ký ca, chấm công, phép (01. Bảng phép năm, 02. BCC)&lt;/li&gt;
        &lt;li&gt;Phiếu đề nghị chấm công bổ sung (03. OT list)&lt;/li&gt;
        &lt;li&gt;%KPI, %OKRs từ link đánh giá; DS từ Kế toán&lt;/li&gt;
        &lt;li&gt;DS HV điểm cao, tái tục, số PT, số mocktest&lt;/li&gt;
      &lt;/ul&gt;
    &lt;/div&gt;
    &lt;div class=&quot;flow-card&quot;&gt;
      &lt;div class=&quot;flow-num&quot;&gt;2&lt;/div&gt;
      &lt;h4&gt;Chốt công &amp;amp; giờ&lt;/h4&gt;
      &lt;ul&gt;
        &lt;li&gt;U = số F + ½F/2 + P + PH&lt;/li&gt;
        &lt;li&gt;GV FT: quy đổi giờ dạy + admin + PT + lễ/phép → ngày công quy đổi &amp;amp; giờ OT&lt;/li&gt;
        &lt;li&gt;PT / TA / Tutor: tổng giờ theo chương trình &amp;amp; cơ sở&lt;/li&gt;
      &lt;/ul&gt;
      &lt;div class=&quot;formula-tag&quot;&gt;Ngày công quy đổi = Tổng giờ quy đổi ÷ Giờ cần làm/ngày&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;flow-card&quot;&gt;
      &lt;div class=&quot;flow-num&quot;&gt;3&lt;/div&gt;
      &lt;h4&gt;Lương cố định&lt;/h4&gt;
      &lt;ul&gt;
        &lt;li&gt;&lt;strong&gt;Theo công:&lt;/strong&gt; (LCB + PC + K) × U ÷ T&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;Theo giờ:&lt;/strong&gt; Σ (giờ × rate)&lt;/li&gt;
        &lt;li&gt;Thử việc (dòng mẫu HR): 85% LCB &lt;span class=&quot;b b-gd&quot;&gt;GĐ&lt;/span&gt;&lt;/li&gt;
      &lt;/ul&gt;
      &lt;div class=&quot;formula-tag&quot;&gt;Lương = (LCB + PC + K) × U ÷ T&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;flow-card&quot;&gt;
      &lt;div class=&quot;flow-num&quot;&gt;4&lt;/div&gt;
      &lt;h4&gt;Phụ cấp&lt;/h4&gt;
      &lt;ul&gt;
        &lt;li&gt;5 khoản, mức cố định theo từng NV, chia theo công&lt;/li&gt;
        &lt;li&gt;AO FT: phụ thuộc % DS/Target&lt;/li&gt;
        &lt;li&gt;AO PT: chia theo giờ (104 giờ chuẩn)&lt;/li&gt;
      &lt;/ul&gt;
      &lt;div class=&quot;formula-tag&quot;&gt;AO FT: &amp;lt;50% → 0 · &amp;lt;80% → 50% · ≥80% → 100%&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;flow-card&quot;&gt;
      &lt;div class=&quot;flow-num&quot;&gt;5&lt;/div&gt;
      &lt;h4&gt;KPI &amp;amp; OKRs&lt;/h4&gt;
      &lt;ul&gt;
        &lt;li&gt;AO / TP: mốc thưởng theo DS × %KPI&lt;/li&gt;
        &lt;li&gt;VP: mức KPI × %KPI; OKRs theo bảng OKRs&lt;/li&gt;
        &lt;li&gt;GV FT: KPI cố định theo giờ tiêu chuẩn (chia theo công)&lt;/li&gt;
      &lt;/ul&gt;
      &lt;div class=&quot;formula-tag&quot;&gt;KPI = Mức × %KPI ÷ 100&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;flow-card&quot;&gt;
      &lt;div class=&quot;flow-num&quot;&gt;6&lt;/div&gt;
      &lt;h4&gt;Làm thêm giờ (OT)&lt;/h4&gt;
      &lt;ul&gt;
        &lt;li&gt;VP / KD: LCB ÷ T ÷ 8 × giờ × 1,5 / 2 / 3&lt;/li&gt;
        &lt;li&gt;GVNN FT: giờ vượt định mức × 300.000&lt;/li&gt;
        &lt;li&gt;GVVN FT: giờ vượt 100h × 120.000 (file mẫu)&lt;/li&gt;
      &lt;/ul&gt;
      &lt;div class=&quot;formula-tag&quot;&gt;OT = LCB × Giờ × Hệ số ÷ T ÷ 8&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;flow-card&quot;&gt;
      &lt;div class=&quot;flow-num&quot;&gt;7&lt;/div&gt;
      &lt;h4&gt;Thưởng &amp;amp; hoa hồng&lt;/h4&gt;
      &lt;ul&gt;
        &lt;li&gt;HH 3% DS, thưởng nhóm 1%, KT lớp 1%, BC/IDP 3%&lt;/li&gt;
        &lt;li&gt;HVĐC, PT, Mocktest, lớp nhóm, tái tục, tuyển dụng&lt;/li&gt;
        &lt;li&gt;RT / SA cuối chu kỳ HĐ (GVNN FT)&lt;/li&gt;
      &lt;/ul&gt;
      &lt;div class=&quot;formula-tag&quot;&gt;Tổng TN = Lương TT + OT + Σ Thưởng (± kỳ trước)&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;flow-card&quot; style=&quot;border-color:var(--green); background:var(--green-pale);&quot;&gt;
      &lt;div class=&quot;flow-num&quot;&gt;8&lt;/div&gt;
      &lt;h4&gt;Khấu trừ → Thực nhận&lt;/h4&gt;
      &lt;ul&gt;
        &lt;li&gt;BHbb 10,5%, công đoàn 0%, thuế TNCN&lt;/li&gt;
        &lt;li&gt;Gross-up nếu nhận NET (GVNN FT, PT Teacher)&lt;/li&gt;
        &lt;li&gt;Truy thu / hồi tố → chia Đợt 1/2(/3), Chuyển khoản / Tiền mặt&lt;/li&gt;
      &lt;/ul&gt;
      &lt;div class=&quot;formula-tag&quot;&gt;Thực nhận = ROUND(TN + Hồi tố − Truy thu − BH − Thuế)&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;!-- ══ CÁC VỊ TRÍ ══ --&gt;
&lt;div class=&quot;section&quot;&gt;
  &lt;div class=&quot;section-title&quot;&gt;💼 Công Thức Theo Vị Trí&lt;/div&gt;
  &lt;p class=&quot;hint&quot;&gt;Di chuột (hoặc chạm) vào từng ô để xem chi tiết công thức, bảng mức và nguồn.&lt;/p&gt;

  &lt;div class=&quot;pos-group&quot;&gt;KHỐI VĂN PHÒNG&lt;/div&gt;
  &lt;div class=&quot;pos-grid&quot;&gt;
    &lt;div class=&quot;pos-card&quot; data-id=&quot;kt&quot;&gt;&lt;span class=&quot;b b-ok&quot;&gt;✔&lt;/span&gt;
      &lt;div class=&quot;pc-name&quot;&gt;1. Kế toán FT&lt;/div&gt;&lt;div class=&quot;pc-badge&quot;&gt;KE TOAN FT · Full time&lt;/div&gt;
      &lt;div class=&quot;pc-formula&quot;&gt;(LCB + PC) × U ÷ T + Thưởng khác&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;pos-card&quot; data-id=&quot;hr&quot;&gt;&lt;span class=&quot;b b-ok&quot;&gt;✔&lt;/span&gt;
      &lt;div class=&quot;pc-name&quot;&gt;2. HR FT&lt;/div&gt;&lt;div class=&quot;pc-badge&quot;&gt;HR FT · Full time&lt;/div&gt;
      &lt;div class=&quot;pc-formula&quot;&gt;(LCB + PC) × U ÷ T + KPI × %KPI + Thưởng tuyển dụng&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;pos-card&quot; data-id=&quot;mktft&quot;&gt;&lt;span class=&quot;b b-ok&quot;&gt;✔&lt;/span&gt;
      &lt;div class=&quot;pc-name&quot;&gt;3. Marketing FT&lt;/div&gt;&lt;div class=&quot;pc-badge&quot;&gt;MARKETING FT · Full time&lt;/div&gt;
      &lt;div class=&quot;pc-formula&quot;&gt;(LCB + PC) × U ÷ T + KPI × %KPI + OKRs&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;pos-card&quot; data-id=&quot;mktpt&quot;&gt;&lt;span class=&quot;b b-ok&quot;&gt;✔&lt;/span&gt;
      &lt;div class=&quot;pc-name&quot;&gt;4. Marketing PT&lt;/div&gt;&lt;div class=&quot;pc-badge&quot;&gt;MARKETING PT · Part time&lt;/div&gt;
      &lt;div class=&quot;pc-formula&quot;&gt;30.000 × Giờ TT × %KPI + OKRs&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;pos-group&quot;&gt;KHỐI KINH DOANH &amp;amp; VẬN HÀNH&lt;/div&gt;
  &lt;div class=&quot;pos-grid&quot;&gt;
    &lt;div class=&quot;pos-card&quot; data-id=&quot;tp&quot;&gt;&lt;span class=&quot;b b-ok&quot;&gt;✔&lt;/span&gt;
      &lt;div class=&quot;pc-name&quot;&gt;5. Trưởng phòng TVTS (AM)&lt;/div&gt;&lt;div class=&quot;pc-badge&quot;&gt;TRƯỞNG PHÒNG TVTS · Full time&lt;/div&gt;
      &lt;div class=&quot;pc-formula&quot;&gt;(LCB+PC)×U÷T + KPI + 3%DS + 1%Team + 1%NV đạt + 1%KT lớp + …&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;pos-card&quot; data-id=&quot;aoft&quot;&gt;&lt;span class=&quot;b b-ok&quot;&gt;✔&lt;/span&gt;
      &lt;div class=&quot;pc-name&quot;&gt;6. Tư vấn FT (AO FT)&lt;/div&gt;&lt;div class=&quot;pc-badge&quot;&gt;TƯ VẤN FT · Full time&lt;/div&gt;
      &lt;div class=&quot;pc-formula&quot;&gt;(LCB + PC&lt;sub&gt;%DS&lt;/sub&gt;)×U÷T + Mốc&lt;sub&gt;DS&lt;/sub&gt;×%KPI + 3%DS + …&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;pos-card&quot; data-id=&quot;aopt&quot;&gt;&lt;span class=&quot;b b-ok&quot;&gt;✔&lt;/span&gt;
      &lt;div class=&quot;pc-name&quot;&gt;7. Tư vấn PT (AO PT)&lt;/div&gt;&lt;div class=&quot;pc-badge&quot;&gt;TƯ VẤN PT · Part time&lt;/div&gt;
      &lt;div class=&quot;pc-formula&quot;&gt;2.000.000 ÷ 104 × Giờ TT + PC + Mốc&lt;sub&gt;DS&lt;/sub&gt;×%KPI + 3%DS&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;pos-card&quot; data-id=&quot;ctv&quot;&gt;&lt;span class=&quot;b b-gd&quot;&gt;GĐ&lt;/span&gt;
      &lt;div class=&quot;pc-name&quot;&gt;8. CTV vận hành / Sale&lt;/div&gt;&lt;div class=&quot;pc-badge&quot;&gt;CỘNG TÁC VIÊN · CTV&lt;/div&gt;
      &lt;div class=&quot;pc-formula&quot;&gt;x% × (DT vận hành NET − Lương Gross GV/Tutor)&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;pos-group&quot;&gt;KHỐI HỌC VỤ&lt;/div&gt;
  &lt;div class=&quot;pos-grid&quot;&gt;
    &lt;div class=&quot;pos-card&quot; data-id=&quot;gvnn&quot;&gt;&lt;span class=&quot;b b-ok&quot;&gt;✔&lt;/span&gt;
      &lt;div class=&quot;pc-name&quot;&gt;9. GV nước ngoài FT&lt;/div&gt;&lt;div class=&quot;pc-badge&quot;&gt;GIÁO VIÊN FT 1 · NET&lt;/div&gt;
      &lt;div class=&quot;pc-formula&quot;&gt;(Lương + KPI)×Công&lt;sub&gt;QĐ&lt;/sub&gt;÷T + OT×300k + PT + HVĐC + RT/SA&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;pos-card&quot; data-id=&quot;gvvn&quot;&gt;&lt;span class=&quot;b b-ok&quot;&gt;✔&lt;/span&gt;
      &lt;div class=&quot;pc-name&quot;&gt;10. GV Việt Nam FT&lt;/div&gt;&lt;div class=&quot;pc-badge&quot;&gt;GIÁO VIÊN FT 2 · Gross&lt;/div&gt;
      &lt;div class=&quot;pc-formula&quot;&gt;(LCB + KPI)×U÷T + Σ Lớp nhóm + OT + PT×25k&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;pos-card&quot; data-id=&quot;ptt&quot;&gt;&lt;span class=&quot;b b-ok&quot;&gt;✔&lt;/span&gt;
      &lt;div class=&quot;pc-name&quot;&gt;11. PT Teacher&lt;/div&gt;&lt;div class=&quot;pc-badge&quot;&gt;GV nước ngoài PT · CTV · NET&lt;/div&gt;
      &lt;div class=&quot;pc-formula&quot;&gt;Σ(Giờ&lt;sub&gt;CT&lt;/sub&gt; × Rate&lt;sub&gt;CT,CS&lt;/sub&gt;) + PV + Mocktest + Tái tục + HVĐC&lt;/div&gt;&lt;/div&gt;

&lt;div class=&quot;tp-data&quot; data-id=&quot;gvnn&quot;&gt;

    &lt;tr&gt;&lt;td&gt;100&lt;/td&gt;&lt;td&gt;20&lt;/td&gt;&lt;td&gt;2 admin = 1 dạy&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;100&lt;/td&gt;&lt;td&gt;12&lt;/td&gt;&lt;td&gt;1 admin = 1 dạy&lt;/td&gt;&lt;/tr&gt;

      &lt;li&gt;Ngày công QĐ = Tổng giờ QĐ ÷ Giờ cần làm/ngày; OT = Tổng giờ QĐ − Định mức&lt;/li&gt;
      &lt;li&gt;Thiếu định mức do trung tâm phân ca không đủ vẫn trả đủ công (file Word)&lt;/li&gt;&lt;/ul&gt;

    &lt;tr&gt;&lt;td&gt;OT&lt;/td&gt;&lt;td&gt;300.000 / giờ, không nhân hệ số; nghỉ hưởng BHXH có thể quy ra giờ OT&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;HVĐC&lt;/td&gt;&lt;td&gt;200.000 / HV 7.5–8.0 · 300.000 / HV ≥ 8.5 · chia theo tỉ lệ giờ dạy&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Placement Interview&lt;/td&gt;&lt;td&gt;50.000 / PT nếu tổng giờ dạy &amp;gt; giờ tiêu chuẩn&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Mocktest&lt;/td&gt;&lt;td&gt;(Speaking ÷ 4 + Writing ÷ 10) giờ × rate trên HĐ&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Round Trip&lt;/td&gt;&lt;td&gt;Cuối chu kỳ 12 tháng · 100% mức HĐ&lt;/td&gt;&lt;/tr&gt;

  &lt;div class=&quot;note&quot;&gt;&lt;strong&gt;Mâu thuẫn:&lt;/strong&gt; 02. BCC quy đổi PT thành 0,25 giờ admin, trong khi cơ cấu trả 50.000/PT. &lt;strong&gt;Rate Mocktest&lt;/strong&gt; &quot;trên HĐ&quot; chưa có số cụ thể.&lt;/div&gt;

&lt;div id=&quot;tp-tooltip&quot;&gt;&lt;button class=&quot;tp-close&quot; type=&quot;button&quot;&gt;Đóng ✕&lt;/button&gt;&lt;div class=&quot;tp-body&quot;&gt;&lt;/div&gt;&lt;/div&gt;

&lt;script&gt;
const tip = document.getElementById(&#x27;tp-tooltip&#x27;);
const tipBody = tip.querySelector(&#x27;.tp-body&#x27;);
let pinned = null, hideTimer = null;

function positionTip(e){
  const pad = 12, tw = tip.offsetWidth || 400, th = tip.offsetHeight || 300;
  let x = e.clientX + 20, y = e.clientY + 14;
  if (x + tw + pad &gt; window.innerWidth) x = e.clientX - tw - 12;
  if (y + th + pad &gt; window.innerHeight) y = window.innerHeight - th - pad;
  tip.style.left = Math.max(pad, x) + &#x27;px&#x27;;
  tip.style.top = Math.max(pad, y) + &#x27;px&#x27;;
}
function fill(id){
  const src = document.querySelector(&#x27;.tp-data[data-id=&quot;&#x27; + id + &#x27;&quot;]&#x27;);
  if (!src) return false;
  tipBody.innerHTML = src.innerHTML; return true;
}
function closePinned(){
  if (pinned) pinned.classList.remove(&#x27;pinned&#x27;);
  pinned = null; tip.classList.remove(&#x27;pinned&#x27;); tip.style.display = &#x27;none&#x27;;
}
document.querySelectorAll(&#x27;.pos-card&#x27;).forEach(card =&gt; {
  card.addEventListener(&#x27;mouseenter&#x27;, e =&gt; {
    if (pinned) return;
    clearTimeout(hideTimer);
    if (fill(card.dataset.id)) { tip.style.display = &#x27;block&#x27;; positionTip(e); }
  });
  card.addEventListener(&#x27;mousemove&#x27;, e =&gt; { if (!pinned) positionTip(e); });
  card.addEventListener(&#x27;mouseleave&#x27;, () =&gt; { if (!pinned) hideTimer = setTimeout(() =&gt; { tip.style.display = &#x27;none&#x27;; }, 120); });
  card.addEventListener(&#x27;click&#x27;, e =&gt; {
    e.stopPropagation();
    if (pinned === card) { closePinned(); return; }
    closePinned();
    if (!fill(card.dataset.id)) return;
    pinned = card; card.classList.add(&#x27;pinned&#x27;);
    tip.classList.add(&#x27;pinned&#x27;); tip.style.display = &#x27;block&#x27;;
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    tip.style.left = Math.max(12, (window.innerWidth - tw) / 2) + &#x27;px&#x27;;
    tip.style.top = Math.max(12, (window.innerHeight - th) / 2) + &#x27;px&#x27;;
  });
});
tip.querySelector(&#x27;.tp-close&#x27;).addEventListener(&#x27;click&#x27;, closePinned);
tip.addEventListener(&#x27;click&#x27;, e =&gt; e.stopPropagation());
document.addEventListener(&#x27;click&#x27;, () =&gt; { if (pinned) closePinned(); });
document.addEventListener(&#x27;keydown&#x27;, e =&gt; { if (e.key === &#x27;Escape&#x27;) closePinned(); });
&lt;/script&gt;
&lt;/body&gt;
